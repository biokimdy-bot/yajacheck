<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 야자 출석체크 (가로모드)</title>
    <style>
        :root { --main: #2c3e50; --absent: #e74c3c; --dim: #ecf0f1; --border: #bdc3c7; }
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #f4f4f4; }
        
        /* 가로모드 사이드바 */
        .sidebar { width: 220px; background: var(--main); color: white; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .sidebar input, .sidebar button { padding: 12px; border-radius: 5px; border: none; font-size: 14px; }
        .save-btn { background: #27ae60; color: white; cursor: pointer; font-weight: bold; margin-top: auto; }
        
        /* 메인 영역 */
        .content { flex: 1; display: flex; flex-direction: column; padding: 15px; overflow: hidden; }
        .tabs { display: flex; gap: 10px; margin-bottom: 10px; }
        .tab { padding: 10px 20px; background: #ddd; border-radius: 5px; cursor: pointer; border: none; }
        .tab.active { background: #3498db; color: white; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; overflow-y: auto; align-content: start; }
        
        /* 좌석 카드 */
        .seat { background: white; border: 1px solid var(--border); padding: 8px; border-radius: 8px; text-align: center; }
        .seat.expulsion { border: 2px solid var(--absent); background: #fff5f5; }
        .seat-info { font-weight: bold; font-size: 13px; margin-bottom: 5px; display: block; }
        .btns { display: flex; justify-content: center; gap: 3px; }
        .b { width: 32px; height: 32px; border: 1px solid #ccc; background: white; cursor: pointer; border-radius: 4px; font-size: 11px; }
        .b.selected { background: var(--absent); color: white; border-color: var(--absent); }
        .b:disabled { background: var(--dim); color: #ccc; cursor: default; border: none; }
        .count-tag { font-size: 10px; color: var(--absent); font-weight: bold; }
    </style>
</head>

<div class="sidebar">
    <h3>야자 체크</h3>
    <input type="date" id="datePicker">
    <input type="text" id="teacher" placeholder="작성자 성함">
    <div id="loading" style="font-size: 12px; color: #aaa;">누적 데이터 로딩중...</div>
    <button class="save-btn" onclick="sendToSheet()">결석 데이터 저장</button>
</div>

    let summaryData = {}; // 구글 시트에서 가져온 누적 결석수

    document.getElementById('datePicker').valueAsDate = new Date();

    async function fetchSummary() {
        try {
            const res = await fetch(SCRIPT_URL);
            summaryData = await res.json();
            document.getElementById('loading').innerText = "데이터 동기화 완료";
            render();
        } catch(e) { console.log("로드 실패"); render(); }
    }

    function render() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        const dateVal = document.getElementById('datePicker').value;
        const dayMap = ['sun','mon','tue','wed','thu','fri','sat'];
        const day = dayMap[new Date(dateVal).getDay()];

        db[currentPlace].forEach(s => {
            const daySch = s.sch[day] || [0,0,0];
            const count = summaryData[s.name] || 0;
            const isExpulsion = count >= 5;

            const div = document.createElement('div');
            div.className = `seat ${isExpulsion ? 'expulsion' : ''}`;
            div.innerHTML = `
                <span class="seat-info">${s.id}. ${s.name} <span class="count-tag">${count}회</span></span>
                <div class="btns">
                    <button class="b" ${daySch[0]?'':'disabled'} onclick="this.classList.toggle('selected')">8</button>
                    <button class="b" ${daySch[1]?'':'disabled'} onclick="this.classList.toggle('selected')">1</button>
                    <button class="b" ${daySch[2]?'':'disabled'} onclick="this.classList.toggle('selected')">2</button>
                </div>
            `;
            div.dataset.name = s.name;
            div.dataset.id = s.id;
            grid.appendChild(div);
        });
    }

    async function sendToSheet() {
        const teacher = document.getElementById('teacher').value;
        if(!teacher) return alert("선생님 성함을 입력하세요");
        
        const payload = {
            date: document.getElementById('datePicker').value,
            dayOfWeek: new Date(document.getElementById('datePicker').value).toLocaleDateString('ko-KR', {weekday:'long'}),
            author: teacher,
            absents: []
        };

        document.querySelectorAll('.seat').forEach(seat => {
            seat.querySelectorAll('.b.selected').forEach(btn => {
                payload.absents.push({
                    place: currentPlace === 'bitmuri' ? '빛무리터' : '학습카페',
                    seatId: seat.dataset.id,
                    name: seat.dataset.name,
                    session: btn.innerText
                });
            });
        });

        if(payload.absents.length === 0) return alert("체크된 결석자가 없습니다.");

        if(confirm(`총 ${payload.absents.length}건을 저장할까요?`)) {
            const res = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            if(result.result === 'success') {
                alert("저장되었습니다.");
                location.reload();
            }
        }
    }

    function setPlace(p) {
        currentPlace = p;
        document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (i===0 && p==='bitmuri') || (i===1 && p==='cafe')));
        render();
    }

    document.getElementById('datePicker').onchange = render;
