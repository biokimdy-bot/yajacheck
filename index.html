<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>2026 야자 통합 출석체크</title>
    <style>
        :root { --main: #2c3e50; --absent: #e74c3c; --dim: #ecf0f1; --border: #bdc3c7; }
        body { font-family: 'Pretendard', sans-serif; margin: 0; display: flex; height: 100vh; background: #f1f2f6; overflow: hidden; }
        
        /* 사이드바 */
        .sidebar { width: 180px; background: var(--main); color: white; padding: 15px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
        .sidebar input { padding: 8px; border-radius: 4px; border: none; margin-bottom: 5px; width: 100%; box-sizing: border-box; }
        .save-btn { background: #27ae60; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: auto; }
        
        /* 메인 영역 */
        .content { flex: 1; display: flex; flex-direction: column; padding: 10px; position: relative; overflow: auto; }
        .tabs { display: flex; gap: 10px; margin-bottom: 10px; }
        .tab { padding: 10px 20px; background: #ccc; border-radius: 5px; cursor: pointer; border: none; font-weight: bold; }
        .tab.active { background: #3498db; color: white; }

        /* 지도 캔버스 */
        .map-canvas { 
            position: relative; 
            width: 1000px; 
            height: 650px; 
            background: white; 
            border: 2px solid #b2bec3; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* 좌석 스타일 */
        .seat { 
            position: absolute; 
            width: 75px; height: 65px; 
            background: #fff; border: 1px solid var(--border); 
            border-radius: 4px; display: flex; flex-direction: column; 
            justify-content: space-around; padding: 3px; box-sizing: border-box; 
        }
        .seat.expulsion { border: 2px solid var(--absent); background: #fff5f5; }
        .seat-header { display: flex; justify-content: space-between; font-size: 10px; color: #7f8c8d; }
        .seat-name { font-weight: bold; font-size: 12px; text-align: center; }
        
        .btns { display: flex; justify-content: center; gap: 2px; }
        .b { width: 22px; height: 22px; border: 1px solid #ddd; background: #fff; cursor: pointer; border-radius: 3px; font-size: 9px; }
        .b.selected { background: var(--absent); color: white; border-color: var(--absent); }
        .b:disabled { background: var(--dim); color: #ccc; border: none; }

        /* 문/창문 표시 */
        .facility { position: absolute; background: #dfe6e9; border: 1px dashed #b2bec3; font-size: 11px; display: flex; align-items: center; justify-content: center; color: #636e72; }
    </style>
</head>

    <button class="save-btn" onclick="sendToSheet()">데이터 저장</button>
</div>

    async function fetchSummary() {
        try {

            render();
        } catch(e) { document.getElementById('loading').innerText = "오프라인 모드"; render(); }

    function render() {
        const map = document.getElementById('map');
        map.innerHTML = '';
        const dateVal = document.getElementById('datePicker').value;
        const dayMap = ['sun','mon','tue','wed','thu','fri','sat'];
        const day = dayMap[new Date(dateVal).getDay()];

        // 보조 시설물 배치

            map.innerHTML += '<div class="facility" style="left:380px; top:550px; width:120px; height:40px;">출입문 1</div>';
            map.innerHTML += '<div class="facility" style="left:650px; top:550px; width:120px; height:40px;">출입문 2</div>';
        } else {
            map.innerHTML += '<div class="facility" style="left:30px; top:30px; width:150px; height:40px;">유리문 출입구</div>';
            map.innerHTML += '<div class="facility" style="left:300px; top:0; width:500px; height:20px;">창문 구역</div>';
        }

        db[currentPlace].forEach(s => {
            const daySch = s.sch[day] || [0,0,0];
            const count = summaryData[s.name] || 0;
            const isExpulsion = count >= 5;

            const div = document.createElement('div');
            div.className = `seat ${isExpulsion ? 'expulsion' : ''}`;
            div.style.left = s.x + 'px';
            div.style.top = s.y + 'px';
            div.innerHTML = `
                <div class="seat-header"><span>#${s.id}</span> <span style="color:red">${count > 0 ? count : ''}</span></div>
                <div class="seat-name">${s.name}</div>
                <div class="btns">
                    <button class="b" ${daySch[0]?'':'disabled'} onclick="this.classList.toggle('selected')">8</button>
                    <button class="b" ${daySch[1]?'':'disabled'} onclick="this.classList.toggle('selected')">1</button>
                    <button class="b" ${daySch[2]?'':'disabled'} onclick="this.classList.toggle('selected')">2</button>
                </div>
            `;
            div.dataset.name = s.name;
            div.dataset.id = s.id;
            map.appendChild(div);
        });
    }

    function setPlace(p) {
        currentPlace = p;
        document.querySelectorAll('.tab').forEach((t, i) => {
            t.classList.toggle('active', (i === 0 && p === 'bitmuri') || (i === 1 && p === 'cafe'));
        });
        render();
    }

    async function sendToSheet() {
        const teacher = document.getElementById('teacher').value;
        if(!teacher) return alert("선생님 성함을 입력하세요.");
        
        const payload = {
            date: document.getElementById('datePicker').value,
            dayOfWeek: new Date(document.getElementById('datePicker').value).toLocaleDateString('ko-KR', {weekday:'long'}),
            author: teacher,
            absents: []
        };

        document.querySelectorAll('.seat').forEach(seat => {
            seat.querySelectorAll('.b.selected').forEach(btn => {
                payload.absents.push({
                    place: currentPlace === 'bitmuri' ? '빛무리터' : '학습카페',
                    seatId: seat.dataset.id,
                    name: seat.dataset.name,
                    session: btn.innerText
                });
            });
        });

        if(payload.absents.length === 0) return alert("체크된 결석자가 없습니다.");

        if(confirm(`총 ${payload.absents.length}건의 결석 데이터를 전송할까요?`)) {
            const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            const result = await res.json();
            if(result.result === 'success') { alert("저장되었습니다."); location.reload(); }
        }
    }

    document.getElementById('datePicker').onchange = render;
