<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 야자 스마트 출석체크</title>
    <style>
        :root { --main: #2c3e50; --absent: #e74c3c; --dim: #ecf0f1; --border: #bdc3c7; }
        body { font-family: 'Pretendard', sans-serif; margin: 0; display: flex; height: 100vh; background: #f1f2f6; overflow: hidden; }
        
        /* 좌측 사이드바 */
        .sidebar { width: 180px; background: var(--main); color: white; padding: 15px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; z-index: 10; }
        .sidebar input { padding: 10px; border-radius: 4px; border: none; margin-bottom: 5px; width: 100%; box-sizing: border-box; }
        .save-btn { background: #27ae60; color: white; padding: 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: auto; font-size: 14px; }
        
        /* 우측 메인 도면 영역 */
        .content { flex: 1; display: flex; flex-direction: column; padding: 10px; overflow: auto; position: relative; }
        .tabs { display: flex; gap: 10px; margin-bottom: 10px; }
        .tab { padding: 10px 25px; background: #ccc; border-radius: 5px; cursor: pointer; border: none; font-weight: bold; font-size: 14px; }
        .tab.active { background: #3498db; color: white; }

        /* 캔버스 (배치도) */
        .map-canvas { position: relative; width: 1000px; height: 650px; background: white; border: 2px solid #b2bec3; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        /* 좌석 개별 카드 */
        .seat { position: absolute; width: 75px; height: 65px; background: #fff; border: 1px solid var(--border); border-radius: 4px; display: flex; flex-direction: column; justify-content: space-around; padding: 3px; box-sizing: border-box; box-shadow: 1px 1px 3px rgba(0,0,0,0.05); }
        .seat-header { display: flex; justify-content: space-between; font-size: 10px; color: #7f8c8d; }
        .seat-name { font-weight: bold; font-size: 12px; text-align: center; white-space: nowrap; overflow: hidden; }
        
        /* 결석 체크 버튼 */
        .btns { display: flex; justify-content: center; gap: 2px; }
        .b { width: 22px; height: 22px; border: 1px solid #ddd; background: #fff; cursor: pointer; border-radius: 3px; font-size: 9px; font-weight: bold; }
        .b.selected { background: var(--absent); color: white; border-color: var(--absent); }
        .b:disabled { background: var(--dim); color: #ccc; border: none; cursor: not-allowed; }

        /* 수요일 안내 메시지 */
        .wed-msg { display: flex; justify-content: center; align-items: center; height: 100%; color: #7f8c8d; font-size: 20px; font-weight: bold; background: #f8f9fa; border-radius: 8px; }
    </style>
</head>
<body>

<div class="sidebar">
    <h3 style="margin:0 0 5px 0">야자 출석 체크</h3>
    <label>날짜 선택</label>
    <input type="date" id="datePicker">
    <label>선생님 성함</label>
    <input type="text" id="teacher" placeholder="기록자 입력">
    <div id="loading" style="font-size:12px; color:#f1c40f; font-weight:bold;">데이터 불러오는 중...</div>
    <button class="save-btn" onclick="sendData()">결석 저장하기</button>
</div>

<div class="content">
    <div class="tabs">
        <button id="tab-bitmuri" class="tab active" onclick="setPlace('빛무리터')">빛무리터</button>
        <button id="tab-cafe" class="tab" onclick="setPlace('학습카페')">학습카페</button>
    </div>
    <div id="map" class="map-canvas"></div>
</div>

<script>
    // ⚠️ 중요: 아래 따옴표 안에 선생님의 구글 앱스 스크립트 '배포 URL'을 꼭 넣으세요!
    const SCRIPT_URL = "여기에_선생님의_구글_앱스_스크립트_배포_URL을_붙여넣으세요"; 

    let fullData = {}; 
    let currentPlace = '빛무리터';
    
    // 도면 좌표 설정 (x, y)
    const coords = {
        "빛무리터": {
            21: {x:50, y:30}, 22: {x:135, y:30}, 23: {x:220, y:30}, 24: {x:305, y:30},
            1: {x:50, y:150}, 2: {x:135, y:150}, 3: {x:220, y:150}, 4: {x:305, y:150}, 5: {x:390, y:150}, 6: {x:475, y:150},
            9: {x:50, y:225}, 10: {x:135, y:225}, 11: {x:220, y:225}, 12: {x:305, y:225}, 13: {x:390, y:225}, 14: {x:475, y:225},
            7: {x:600, y:150}, 8: {x:685, y:150}, 15: {x:600, y:225}, 16: {x:685, y:225},
            17: {x:400, y:450}, 18: {x:485, y:450}, 19: {x:570, y:450}, 20: {x:655, y:450}
        },
        "학습카페": {
            30: {x:400, y:30}, 31: {x:485, y:30}, 32: {x:570, y:30}, 33: {x:655, y:30},
            25: {x:30, y:150}, 26: {x:30, y:230}, 27: {x:30, y:310}, 28: {x:30, y:390}, 29: {x:30, y:470},
            34: {x:200, y:150}, 36: {x:200, y:220}, 37: {x:200, y:290}, 39: {x:200, y:360}, 41: {x:200, y:430}, 43: {x:200, y:500},
            35: {x:280, y:150}, 38: {x:280, y:220}, 40: {x:280, y:290}, 42: {x:280, y:360}, 44: {x:280, y:430},
            45: {x:450, y:150}, 47: {x:450, y:220}, 49: {x:450, y:290}, 51: {x:450, y:360}, 53: {x:450, y:430}, 55: {x:450, y:500},
            46: {x:530, y:150}, 48: {x:530, y:220}, 50: {x:530, y:290}, 52: {x:530, y:360}, 54: {x:530, y:430}, 56: {x:530, y:500}
        }
    };

    document.getElementById('datePicker').valueAsDate = new Date();

    // 구글 시트에서 데이터 불러오기
    async function loadSheetData() {
        try {
            const res = await fetch(SCRIPT_URL);
            fullData = await res.json();
            document.getElementById('loading').innerText = "✅ 데이터 동기화 완료";
            document.getElementById('loading').style.color = "#2ecc71";
            render();
        } catch(e) {
            document.getElementById('loading').innerText = "❌ 데이터 로딩 실패";
            document.getElementById('loading').style.color = "#e74c3c";
        }
    }

    // 화면 그리기 함수
    function render() {
        const map = document.getElementById('map');
        map.innerHTML = ''; 
        
        const selectedDate = new Date(document.getElementById('datePicker').value);
        const days = ['일','월','화','수','목','금','토'];
        const dayName = days[selectedDate.getDay()];
        
        // 1. 수요일 차단 처리
        if (dayName === '수') {
            map.innerHTML = `<div class="wed-msg">오늘은 수요일이라 정규 야간자율학습이 없습니다. 😊</div>`;
            return; 
        }

        if(!fullData[currentPlace]) return;

        // 2. 좌석 렌더링
        fullData[currentPlace].forEach(s => {
            const pos = coords[currentPlace][s.id] || {x: -1000, y: -1000}; // 도면에 없는 번호는 화면 밖으로
            const sch = s.sch[dayName] || [0, 0, 0]; // 해당 요일의 시간표 배열 [8교시, 야자1, 야자2]

            const card = document.createElement('div');
            card.className = 'seat';
            card.style.left = pos.x + 'px';
            card.style.top = pos.y + 'px';
            card.innerHTML = `
                <div class="seat-header">#${s.id}</div>
                <div class="seat-name">${s.name}</div>
                <div class="btns">
                    <button class="b" ${sch[0] ? '' : 'disabled'} onclick="this.classList.toggle('selected')">8</button>
                    <button class="b" ${sch[1] ? '' : 'disabled'} onclick="this.classList.toggle('selected')">1</button>
                    <button class="b" ${sch[2] ? '' : 'disabled'} onclick="this.classList.toggle('selected')">2</button>
                </div>
            `;
            card.dataset.id = s.id;
            card.dataset.name = s.name;
            map.appendChild(card);
        });
    }

    // 장소 탭 변경
    function setPlace(p) {
        currentPlace = p;
        document.getElementById('tab-bitmuri').classList.toggle('active', p === '빛무리터');
        document.getElementById('tab-cafe').classList.toggle('active', p === '학습카페');
        render();
    }

    // 구글 시트로 데이터 전송 (저장)
    async function sendData() {
        const teacher = document.getElementById('teacher').value;
        if(!teacher) return alert("선생님 성함을 먼저 입력해 주세요.");
        
        const date = document.getElementById('datePicker').value;
        const absents = [];

        document.querySelectorAll('.seat').forEach(seat => {
            seat.querySelectorAll('.b.selected').forEach(btn => {
                absents.push({
                    place: currentPlace,
                    id: seat.dataset.id,
                    name: seat.dataset.name,
                    session: btn.innerText
                });
            });
        });

        if(absents.length === 0) return alert("체크된 결석자가 없습니다.");

        if(confirm(`총 ${absents.length}건의 결석 데이터를 저장하시겠습니까?`)) {
            document.getElementById('loading').innerText = "전송 중...";
            document.getElementById('loading').style.color = "#f39c12";

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ date, teacher, absents })
                });
                const res = await response.json();
                if(res.result === 'success') {
                    alert("성공적으로 저장되었습니다.");
                    location.reload(); // 저장 후 화면 새로고침
                }
            } catch(e) {
                alert("저장 중 오류가 발생했습니다. 네트워크나 URL을 확인해주세요.");
                document.getElementById('loading').innerText = "✅ 데이터 동기화 완료";
                document.getElementById('loading').style.color = "#2ecc71";
            }
        }
    }

    // 날짜 변경 시 즉시 렌더링
    document.getElementById('datePicker').onchange = render;
    
    // 초기 실행
    if(SCRIPT_URL.includes("여기에_선생님의")) {
        alert("코드 내의 SCRIPT_URL을 선생님의 구글 앱스 스크립트 주소로 변경해주세요!");
    } else {
        loadSheetData();
    }
</script>
</body>
</html>
