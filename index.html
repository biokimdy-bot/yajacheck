<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 야자 배치도형 출석체크</title>
    <style>
        :root { --main: #2c3e50; --absent: #e74c3c; --dim: #ecf0f1; --border: #bdc3c7; }
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #dfe6e9; }
        
        .sidebar { width: 200px; background: var(--main); color: white; padding: 15px; display: flex; flex-direction: column; gap: 10px; z-index: 10; }
        .sidebar input, .sidebar button { padding: 10px; border-radius: 5px; border: none; }
        .save-btn { background: #27ae60; color: white; cursor: pointer; font-weight: bold; margin-top: auto; }
        
        .content { flex: 1; display: flex; flex-direction: column; padding: 10px; position: relative; overflow: auto; }
        .tabs { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab { padding: 8px 15px; background: #ccc; border-radius: 5px; cursor: pointer; border: none; }
        .tab.active { background: #3498db; color: white; }

        /* 도면 레이아웃 핵심 */
        .map-canvas { 
            position: relative; 
            width: 950px; /* 도면 가로 크기 고정 */
            height: 600px; 
            background: white; 
            border-radius: 10px; 
            border: 2px solid #b2bec3;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin: auto;
        }

        /* 좌석 공통 스타일 */
        .seat { 
            position: absolute; 
            width: 85px; 
            height: 75px; 
            background: #fff; 
            border: 1px solid var(--border); 
            border-radius: 5px; 
            font-size: 11px; 
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
            box-sizing: border-box;
        }
        .seat.expulsion { border: 2px solid var(--absent); background: #fff5f5; }
        .seat-num { font-weight: bold; color: #636e72; }
        .seat-name { font-weight: bold; font-size: 12px; overflow: hidden; white-space: nowrap; }
        
        .btns { display: flex; justify-content: center; gap: 2px; }
        .b { width: 24px; height: 24px; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 3px; font-size: 9px; }
        .b.selected { background: var(--absent); color: white; }
        .b:disabled { background: var(--dim); color: #ccc; border: none; }

        /* 지형물 표시 */
        .facility { position: absolute; background: #ecf0f1; border: 1px dashed #b2bec3; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #7f8c8d; }
    </style>
</head>

    function render() {
        const map = document.getElementById('map');

        const dayMap = ['sun','mon','tue','wed','thu','fri','sat'];
        const day = dayMap[new Date(document.getElementById('datePicker').value).getDay()];

        // 도면 부가 요소 (문 등)
        if(currentPlace === 'bitmuri') {
            map.innerHTML += '<div class="facility" style="left:400px; bottom:0; width:100px; height:30px;">출입문</div>';
        }

        db[currentPlace].forEach(s => {
            const daySch = s.sch[day] || [0,0,0];
            const count = summaryData[s.name] || 0;
            const card = document.createElement('div');
            card.className = `seat ${count >= 5 ? 'expulsion' : ''}`;
            card.style.left = s.x + 'px';
            card.style.top = s.y + 'px';
            card.innerHTML = `
                <div class="seat-num">${s.id}</div>
                <div class="seat-name">${s.name}</div>
                <div class="btns">
                    <button class="b" ${daySch[0]?'':'disabled'} onclick="this.classList.toggle('selected')">8</button>
                    <button class="b" ${daySch[1]?'':'disabled'} onclick="this.classList.toggle('selected')">1</button>
                    <button class="b" ${daySch[2]?'':'disabled'} onclick="this.classList.toggle('selected')">2</button>
                </div>
            `;
            card.dataset.id = s.id;
            card.dataset.name = s.name;
            map.appendChild(card);
        });
    }

    function setPlace(p) {
        currentPlace = p;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        render();
    }

    // 초기 실행
    document.getElementById('datePicker').onchange = render;
