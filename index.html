<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 야자 스마트 출석체크</title>
    <style>
        :root { --main: #2c3e50; --absent: #e74c3c; --dim: #ecf0f1; --border: #bdc3c7; }
        body { font-family: 'Pretendard', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #f1f2f6; overflow: hidden; }
        
        .controls { background: var(--main); color: white; padding: 10px 15px; display: flex; align-items: center; gap: 15px; font-size: 13px; z-index: 10; }
        .controls h3 { margin: 0; font-size: 16px; margin-right: 10px; }
        .controls .input-group { display: flex; align-items: center; gap: 5px; }
        .controls input { padding: 8px; border-radius: 4px; border: none; font-size: 13px; }
        .controls input[type="date"] { width: 130px; }
        .controls input[type="text"] { width: 110px; }
        .status-msg { font-size: 12px; color: #f1c40f; font-weight: bold; margin-left: auto; }
        .save-btn { background: #27ae60; color: white; padding: 8px 18px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .content { flex: 1; display: flex; flex-direction: column; padding: 10px; overflow: auto; }
        .tabs { display: flex; gap: 10px; margin-bottom: 10px; }
        .tab { padding: 8px 20px; background: #ccc; border-radius: 5px; cursor: pointer; border: none; font-weight: bold; }
        .tab.active { background: #3498db; color: white; }

        .map-canvas { position: relative; width: 1000px; height: 600px; background: white; border: 2px solid #b2bec3; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        .seat { position: absolute; width: 72px; height: 62px; background: #fff; border: 1px solid var(--border); border-radius: 4px; display: flex; flex-direction: column; justify-content: space-around; padding: 2px; box-sizing: border-box; }
        .seat.wide { width: 95px; height: 68px; border: 2px solid #34495e; }
        .seat-header { font-size: 9px; color: #7f8c8d; text-align: left; padding-left: 2px; }
        .seat-name { font-weight: bold; font-size: 12px; text-align: center; overflow: hidden; }
        
        .btns { display: flex; justify-content: center; gap: 2px; }
        .b { width: 21px; height: 21px; border: 1px solid #ddd; background: #fff; cursor: pointer; border-radius: 3px; font-size: 9px; font-weight: bold; }
        .b.selected { background: var(--absent); color: white; border-color: var(--absent); }
        .b:disabled { background: var(--dim); color: #ccc; border: none; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="controls">
    <h3>야자 출석체크</h3>
    <div class="input-group"><label>날짜:</label><input type="date" id="datePicker"></div>
    <div class="input-group"><label>기록자:</label><input type="text" id="teacher" placeholder="선생님 성함"></div>
    <div id="loading" class="status-msg">데이터 로딩 중...</div>
    <button class="save-btn" onclick="sendData()">결석 저장하기</button>
</div>

<div class="content">
    <div class="tabs">
        <button id="tab-bitmuri" class="tab active" onclick="setPlace('빛무리터')">빛무리터</button>
        <button id="tab-cafe" class="tab" onclick="setPlace('학습카페')">학습카페</button>
    </div>
    <div id="map" class="map-canvas"></div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzASrlrWLGfExtAuPLNbW0cRQgjkq3rksJ6mKOjstBFWZ5LP8dI5jXZzPz4pWZSyaE/exec"; 
    let fullData = {}; 
    let currentPlace = '빛무리터';
    
    const coords = {
        "빛무리터": {
            21: {x:30, y:20, wide:true}, 22: {x:135, y:20, wide:true}, 23: {x:240, y:20, wide:true}, 24: {x:345, y:20, wide:true},
            1: {x:30, y:110}, 2: {x:105, y:110}, 3: {x:180, y:110}, 4: {x:255, y:110}, 5: {x:330, y:110}, 6: {x:405, y:110},
            9: {x:30, y:175}, 10: {x:105, y:175}, 11: {x:180, y:175}, 12: {x:255, y:175}, 13: {x:330, y:175}, 14: {x:405, y:175},
            17: {x:180, y:260}, 18: {x:255, y:260}, 19: {x:330, y:260}, 20: {x:405, y:260},
            7: {x:510, y:110}, 8: {x:585, y:110}, 15: {x:510, y:175}, 16: {x:585, y:175}
        },
        "학습카페": {
            30: {x:300, y:20, wide:true}, 31: {x:405, y:20, wide:true}, 32: {x:510, y:20, wide:true}, 33: {x:615, y:20, wide:true},
            // 덩어리 1 (34~45): 사진 기반 지그재그 배치
            34: {x:150, y:110}, 35: {x:225, y:110}, 
            36: {x:150, y:175}, 38: {x:225, y:175}, 
            37: {x:150, y:240}, 40: {x:225, y:240}, 
            39: {x:150, y:305}, 42: {x:225, y:305}, 
            41: {x:150, y:370}, 44: {x:225, y:370}, 
            43: {x:150, y:435}, 45: {x:150, y:500}, // 43, 45번은 사진처럼 왼쪽 아래로
            // 덩어리 2 (46~56): 번호 교차 지그재그 (간격 105px 적용)
            46: {x:330, y:110}, 47: {x:405, y:110}, 
            48: {x:330, y:175}, 49: {x:405, y:175}, 
            50: {x:330, y:240}, 51: {x:405, y:240}, 
            52: {x:330, y:305}, 53: {x:405, y:305}, 
            54: {x:330, y:370}, 55: {x:405, y:370}, 
            56: {x:330, y:435},
            // 덩어리 3 (25~29): 벽면 (간격 105px 적용)
            25: {x:510, y:110}, 26: {x:510, y:175}, 27: {x:510, y:240}, 28: {x:510, y:305}, 29: {x:510, y:370}
        }
    };

    document.getElementById('datePicker').valueAsDate = new Date();

    async function loadSheetData() {
        document.getElementById('loading').innerText = "🔄 동기화 중...";
        try {
            const res = await fetch(SCRIPT_URL);
            fullData = await res.json();
            document.getElementById('loading').innerText = "✅ 동기화 완료";
            render();
        } catch(e) { document.getElementById('loading').innerText = "❌ 로딩 실패"; }
    }

    function render() {
        const map = document.getElementById('map');
        map.innerHTML = '';
        const dayName = ['일','월','화','수','목','금','토'][new Date(document.getElementById('datePicker').value).getDay()];
        
        if (dayName === '수') {
            map.innerHTML = `<div style="display:flex;justify-content:center;align-items:center;height:100%;color:#7f8c8d;font-weight:bold;">오늘은 수요일이라 정규 야자가 없습니다. 😊</div>`;
            return; 
        }

        if(!fullData[currentPlace]) return;

        fullData[currentPlace].forEach(s => {
            const pos = coords[currentPlace][s.id];
            if(!pos) return; 

            const sch = s.sch[dayName] || [0, 0, 0];
            const card = document.createElement('div');
            card.className = `seat ${pos.wide ? 'wide' : ''}`;
            card.style.left = pos.x + 'px';
            card.style.top = pos.y + 'px';
            card.innerHTML = `
                <div class="seat-header">#${s.id}</div>
                <div class="seat-name">${s.name}</div>
                <div class="btns">
                    <button class="b" ${sch[0] ? '' : 'disabled'}>8</button>
                    <button class="b" ${sch[1] ? '' : 'disabled'}>1</button>
                    <button class="b" ${sch[2] ? '' : 'disabled'}>2</button>
                </div>
            `;
            card.querySelectorAll('.b').forEach(btn => {
                if(!btn.disabled) btn.onclick = () => btn.classList.toggle('selected');
            });
            card.dataset.id = s.id; card.dataset.name = s.name;
            map.appendChild(card);
        });
    }

    function setPlace(p) {
        currentPlace = p;
        document.getElementById('tab-bitmuri').classList.toggle('active', p === '빛무리터');
        document.getElementById('tab-cafe').classList.toggle('active', p === '학습카페');
        render();
    }

    document.getElementById('datePicker').onchange = loadSheetData;

    async function sendData() {
        const teacher = document.getElementById('teacher').value;
        if(!teacher) return alert("선생님 성함을 입력하세요.");
        const date = document.getElementById('datePicker').value;
        const absents = [];
        document.querySelectorAll('.seat').forEach(seat => {
            seat.querySelectorAll('.b.selected').forEach(btn => {
                absents.push({ place: currentPlace, id: seat.dataset.id, name: seat.dataset.name, session: btn.innerText });
            });
        });
        if(absents.length === 0) return alert("결석자를 선택하세요.");
        if(confirm(`${absents.length}건을 저장할까요?`)) {
            const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ date, teacher, absents }) });
            const res = await response.json();
            if(res.result === 'success') { alert("저장 완료!"); location.reload(); }
        }
    }
    loadSheetData();
</script>
</body>
</html>
