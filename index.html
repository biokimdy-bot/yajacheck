<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 야자 스마트 출석체크</title>
    <style>
        :root { --main: #2c3e50; --absent: #e74c3c; --dim: #bdc3c7; --border: #95a5a6; }
        body { font-family: 'Pretendard', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #f1f2f6; overflow: hidden; }
        
        .controls { background: var(--main); color: white; padding: 10px 15px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13px; z-index: 10; }
        .controls h3 { margin: 0; font-size: 16px; margin-right: 5px; }
        .controls .input-group { display: flex; align-items: center; gap: 5px; }
        .controls input, .controls select { padding: 7px; border-radius: 4px; border: none; font-size: 13px; font-family: inherit; }
        .controls input[type="date"] { width: 120px; }
        
        .status-msg { font-size: 12px; color: #f1c40f; font-weight: bold; margin-left: auto; }
        .save-btn { background: #27ae60; color: white; padding: 8px 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-left: auto; }

        .content { flex: 1; display: flex; flex-direction: column; padding: 10px; overflow: auto; }
        .tabs { display: flex; gap: 10px; margin-bottom: 10px; }
        .tab { padding: 8px 20px; background: #ccc; border-radius: 5px; cursor: pointer; border: none; font-weight: bold; }
        .tab.active { background: #3498db; color: white; }

        .map-canvas { position: relative; width: 1000px; height: 600px; background: white; border: 2px solid #b2bec3; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        .seat { position: absolute; width: 72px; height: 62px; background: #fff; border: 2px solid var(--border); border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s; box-sizing: border-box; }
        .seat.wide { width: 95px; height: 68px; }
        
        .seat-header { font-size: 10px; color: #7f8c8d; margin-bottom: 2px; }
        .seat-name { font-weight: bold; font-size: 14px; color: #2c3e50; }
        
        /* 결석(선택) 상태 */
        .seat.selected { background: #ffebee; border-color: var(--absent); }
        .seat.selected .seat-name { color: var(--absent); }
        .seat.selected::after { content: '결석'; position: absolute; top: -8px; right: -8px; background: var(--absent); color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: bold; }

        /* 해당 교시 불참(비활성화) 상태 */
        .seat.disabled { background: #ecf0f1; border-color: var(--dim); cursor: not-allowed; opacity: 0.6; }
        .seat.disabled .seat-name { color: #95a5a6; }
    </style>
</head>
<body>

<div class="controls">
    <h3>야자 출석</h3>
    <div class="input-group">
        <input type="date" id="datePicker">
    </div>
    <div class="input-group">
        <select id="sessionPicker">
            <option value="0">8교시</option>
            <option value="1">야자 1교시</option>
            <option value="2">야자 2교시</option>
        </select>
    </div>
    <div class="input-group">
        <select id="teacher">
            <option value="">선생님 선택</option>
            <option value="김동영">김동영</option>
            <option value="김보현">김보현</option>
            <option value="김영철">김영철</option>
            <option value="이선우">이선우</option>
            <option value="이채헌">이채헌</option>
            <option value="전정언">전정언</option>
            <option value="주혜정">주혜정</option>
        </select>
    </div>
    <div id="loading" class="status-msg">로딩 중...</div>
    <button class="save-btn" onclick="sendData()">결석 저장하기</button>
</div>

<div class="content">
    <div class="tabs">
        <button id="tab-bitmuri" class="tab active" onclick="setPlace('빛무리터')">빛무리터</button>
        <button id="tab-cafe" class="tab" onclick="setPlace('학습카페')">학습카페</button>
    </div>
    <div id="map" class="map-canvas"></div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz21aO_Ea1qlPr0TcoVT8oBSH6sIjTytuIyyCk14g3-S9vx8r6ay_M0878w02VRMSw/exec"; 
    let fullData = {}; 
    let currentPlace = '빛무리터';
    let selectedStore = {}; 

    const coords = {
        "빛무리터": {
            21: {x:30, y:20, wide:true}, 22: {x:135, y:20, wide:true}, 23: {x:240, y:20, wide:true}, 24: {x:345, y:20, wide:true},
            1: {x:30, y:110}, 2: {x:105, y:110}, 3: {x:180, y:110}, 4: {x:255, y:110}, 5: {x:330, y:110}, 6: {x:405, y:110},
            9: {x:30, y:175}, 10: {x:105, y:175}, 11: {x:180, y:175}, 12: {x:255, y:175}, 13: {x:330, y:175}, 14: {x:405, y:175},
            17: {x:180, y:260}, 18: {x:255, y:260}, 19: {x:330, y:260}, 20: {x:405, y:260},
            7: {x:510, y:110}, 8: {x:585, y:110}, 15: {x:510, y:175}, 16: {x:585, y:175}
        },
        "학습카페": {
            // 💡 여기 30~33번 X좌표(가로 위치) 간격을 넓게 수정했습니다! (150, 250, 350, 450)
            30: {x:150, y:20, wide:true}, 31: {x:250, y:20, wide:true}, 32: {x:350, y:20, wide:true}, 33: {x:450, y:20, wide:true},
            34: {x:150, y:110}, 35: {x:225, y:110}, 
            36: {x:150, y:175}, 37: {x:225, y:175}, 
            38: {x:150, y:240}, 39: {x:225, y:240}, 
            40: {x:150, y:305}, 41: {x:225, y:305}, 
            42: {x:150, y:370}, 43: {x:225, y:370}, 
            44: {x:150, y:435}, 45: {x:225, y:435},
            46: {x:330, y:110}, 47: {x:405, y:110}, 
            48: {x:330, y:175}, 49: {x:405, y:175}, 
            50: {x:330, y:240}, 51: {x:405, y:240}, 
            52: {x:330, y:305}, 53: {x:405, y:305}, 
            54: {x:330, y:370}, 55: {x:405, y:370}, 
            56: {x:330, y:435},
            25: {x:510, y:110}, 26: {x:510, y:175}, 27: {x:510, y:240}, 28: {x:510, y:305}, 29: {x:510, y:370}
        }
    };

    document.getElementById('datePicker').valueAsDate = new Date();

    async function loadSheetData() {
        document.getElementById('loading').innerText = "🔄 동기화 중...";
        selectedStore = {}; 
        try {
            const res = await fetch(SCRIPT_URL);
            fullData = await res.json();
            document.getElementById('loading').innerText = "✅ 동기화 완료";
            render();
        } catch(e) { document.getElementById('loading').innerText = "❌ 로딩 실패"; }
    }

    function render() {
        const map = document.getElementById('map');
        map.innerHTML = '';
        const dayName = ['일','월','화','수','목','금','토'][new Date(document.getElementById('datePicker').value).getDay()];
        const sessionIdx = parseInt(document.getElementById('sessionPicker').value);
        
        if (dayName === '수') {
            map.innerHTML = `<div style="display:flex;justify-content:center;align-items:center;height:100%;color:#7f8c8d;font-weight:bold;font-size:18px;">오늘은 수요일이라 정규 야자가 없습니다.</div>`;
            return; 
        }

        if(!fullData[currentPlace]) return;

        fullData[currentPlace].forEach(s => {
            const pos = coords[currentPlace][s.id];
            if(!pos) return; 

            const sch = s.sch[dayName] || [0, 0, 0];
            const val = sch[sessionIdx];
            
            const isAttending = val && val != 0 && val != "0" && String(val).toUpperCase() !== "FALSE" && String(val).toUpperCase() !== "X";
            
            const card = document.createElement('div');
            card.className = `seat ${pos.wide ? 'wide' : ''}`;
            
            if (!isAttending) {
                card.classList.add('disabled');
            }

            card.style.left = pos.x + 'px';
            card.style.top = pos.y + 'px';
            
            const storeKey = `${currentPlace}_${s.id}`;
            if(selectedStore[storeKey]) {
                card.classList.add('selected');
            }

            card.innerHTML = `
                <div class="seat-header">#${s.id}</div>
                <div class="seat-name">${s.name}</div>
            `;
            
            if(isAttending) {
                card.onclick = () => {
                    card.classList.toggle('selected');
                    if(card.classList.contains('selected')) {
                        selectedStore[storeKey] = true;
                    } else {
                        delete selectedStore[storeKey];
                    }
                };
            }
            
            map.appendChild(card);
        });
    }

    function setPlace(p) {
        currentPlace = p;
        document.getElementById('tab-bitmuri').classList.toggle('active', p === '빛무리터');
        document.getElementById('tab-cafe').classList.toggle('active', p === '학습카페');
        render();
    }

    document.getElementById('datePicker').onchange = loadSheetData;
    document.getElementById('sessionPicker').onchange = () => {
        selectedStore = {}; 
        render();
    };

async function sendData() {
        const teacher = document.getElementById('teacher').value;
        if(!teacher) return alert("선생님 성함을 선택하세요.");
        
        const date = document.getElementById('datePicker').value;
        const sessionSelect = document.getElementById('sessionPicker');
        const sessionText = sessionSelect.options[sessionSelect.selectedIndex].text;
        
        const sessionMap = { "0": "8", "1": "1", "2": "2" };
        const sessionVal = sessionMap[sessionSelect.value];
        
        const absents = [];
        for (const key in selectedStore) {
            const [place, id] = key.split('_');
            const student = fullData[place].find(st => st.id == id);
            absents.push({ place, id, name: student.name, session: sessionVal });
        }

        if(absents.length === 0) return alert("결석자를 선택하세요.");
        
        if(confirm(`[${sessionText}] 총 ${absents.length}명의 결석을 저장할까요?\n(담당: ${teacher} 선생님)`)) {
            document.getElementById('loading').innerText = "📤 서버로 전송 중...";
            
            // 👉 여기서부터 수정되었습니다! 에러가 나면 화면에 띄워줍니다.
            try {
                const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ date, teacher, absents }) });
                const res = await response.json();
                if(res.result === 'success') { 
                    alert(`${sessionText} 결석 저장이 완료되었습니다!`); 
                    selectedStore = {};
                    render();
                    document.getElementById('loading').innerText = "✅ 전송 완료";
                } else {
                    alert("시트 저장 중 에러가 발생했습니다: " + res.message);
                    document.getElementById('loading').innerText = "❌ 서버 에러";
                }
            } catch(error) {
                alert("통신 에러가 발생했습니다. 구글 앱스 스크립트 주소나 배포 설정을 확인해주세요.\n상세: " + error);
                document.getElementById('loading').innerText = "❌ 통신 에러";
            }
        }
    }
    loadSheetData();
</script>
</body>
</html>
