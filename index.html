<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 야자 스마트 출석체크</title>
    <style>
        :root { --main: #2c3e50; --absent: #e74c3c; --dim: #ecf0f1; --border: #bdc3c7; }
        body { font-family: 'Pretendard', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #f1f2f6; overflow: hidden; }
        
        /* 상단 컨트롤 바 (새로 추가) */
        .controls { background: var(--main); color: white; padding: 10px 15px; display: flex; align-items: center; gap: 15px; font-size: 13px; z-index: 10; border-bottom: 2px solid #34495e; }
        .controls h3 { margin: 0; font-size: 16px; margin-right: 10px; }
        .controls .input-group { display: flex; align-items: center; gap: 5px; }
        .controls input { padding: 8px; border-radius: 4px; border: none; font-size: 13px; box-sizing: border-box; }
        .controls input[type="date"] { width: 130px; }
        .controls input[type="text"] { width: 120px; }
        .controls .status-msg { font-size: 12px; color: #f1c40f; font-weight: bold; margin-left: auto; }
        .save-btn { background: #27ae60; color: white; padding: 8px 18px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; margin-left: 10px; }
        
        /* 메인 콘텐츠 영역 */
        .content { flex: 1; display: flex; flex-direction: column; padding: 10px; overflow: auto; position: relative; }
        
        /* 탭 버튼 */
        .tabs { display: flex; gap: 10px; margin-bottom: 10px; }
        .tab { padding: 8px 20px; background: #ccc; border-radius: 5px; cursor: pointer; border: none; font-weight: bold; font-size: 13px; }
        .tab.active { background: #3498db; color: white; }

        /* 캔버스 (배치도) */
        .map-canvas { position: relative; width: 1000px; height: 580px; background: white; border: 2px solid #b2bec3; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        /* 일반 좌석 */
        .seat { position: absolute; width: 75px; height: 65px; background: #fff; border: 1px solid var(--border); border-radius: 4px; display: flex; flex-direction: column; justify-content: space-around; padding: 3px; box-sizing: border-box; }
        /* 넓은 좌석 (상단용) */
        .seat.wide { width: 100px; height: 70px; background: #f8f9fa; border: 2px solid #34495e; }
        
        .seat-header { display: flex; justify-content: space-between; font-size: 10px; color: #7f8c8d; }
        .seat-name { font-weight: bold; font-size: 12px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* 결석 체크 버튼 */
        .btns { display: flex; justify-content: center; gap: 2px; }
        .b { width: 22px; height: 22px; border: 1px solid #ddd; background: #fff; cursor: pointer; border-radius: 3px; font-size: 9px; font-weight: bold; }
        .b.selected { background: var(--absent); color: white; border-color: var(--absent); }
        .b:disabled { background: var(--dim); color: #ccc; border: none; cursor: not-allowed; }

        /* 수요일 안내 메시지 */
        .wed-msg { display: flex; justify-content: center; align-items: center; height: 100%; color: #7f8c8d; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="controls">
    <h3>야자 출석체크</h3>
    <div class="input-group">
        <label>날짜:</label>
        <input type="date" id="datePicker">
    </div>
    <div class="input-group">
        <label>선생님:</label>
        <input type="text" id="teacher" placeholder="이름 입력">
    </div>
    <div id="loading" class="status-msg">데이터 로딩 중...</div>
    <button class="save-btn" onclick="sendData()">결석 저장하기</button>
</div>

<div class="content">
    <div class="tabs">
        <button id="tab-bitmuri" class="tab active" onclick="setPlace('빛무리터')">빛무리터</button>
        <button id="tab-cafe" class="tab" onclick="setPlace('학습카페')">학습카페</button>
    </div>
    <div id="map" class="map-canvas"></div>
</div>

<script>
    // ⚠️ 여기에 선생님의 구글 앱스 스크립트 배포 URL을 꼭 넣으세요!
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzASrlrWLGfExtAuPLNbW0cRQgjkq3rksJ6mKOjstBFWZ5LP8dI5jXZzPz4pWZSyaE/exec"; 

    let fullData = {}; 
    let currentPlace = '빛무리터';
    
    // 🛠️ 콤팩트해진 도면 좌표 설정 (흰색 바탕 안에 쏙 들어오게 수정)
    const coords = {
        "빛무리터": {
            // 상단 넓은 좌석 (21-24) - 간격 축소
            21: {x:30, y:20, wide:true}, 22: {x:140, y:20, wide:true}, 23: {x:250, y:20, wide:true}, 24: {x:360, y:20, wide:true},
            // 중앙 좌석 - 더 조밀하게
            1: {x:30, y:120}, 2: {x:105, y:120}, 3: {x:180, y:120}, 4: {x:255, y:120}, 5: {x:330, y:120}, 6: {x:405, y:120},
            9: {x:30, y:185}, 10: {x:105, y:185}, 11: {x:180, y:185}, 12: {x:255, y:185}, 13: {x:330, y:185}, 14: {x:405, y:185},
            // 사이드 - 안쪽으로 당김
            7: {x:500, y:120}, 8: {x:575, y:120}, 15: {x:500, y:185}, 16: {x:575, y:185},
            // 하단 - 더 위로 올림
            17: {x:330, y:350}, 18: {x:405, y:350}, 19: {x:480, y:350}, 20: {x:555, y:350}
        },
        "학습카페": {
            // 창가 넓은 좌석 (30-33) - 안쪽으로 당김
            30: {x:350, y:20, wide:true}, 31: {x:460, y:20, wide:true}, 32: {x:570, y:20, wide:true}, 33: {x:680, y:20, wide:true},
            // 오른쪽 벽면 (25-29) - 화면 안쪽으로 확실히 당김
            25: {x:800, y:120}, 26: {x:800, y:180}, 27: {x:800, y:240}, 28: {x:800, y:300}, 29: {x:800, y:360},
            // 중앙 대칭 콤팩트 배치 (간격 줄임)
            34: {x:150, y:120}, 36: {x:150, y:180}, 37: {x:150, y:240}, 39: {x:150, y:300}, 41: {x:150, y:360}, 43: {x:150, y:420}, 45: {x:150, y:480},
            35: {x:220, y:120}, 38: {x:220, y:180}, 40: {x:220, y:240}, 42: {x:220, y:300}, 44: {x:220, y:360},
            46: {x:400, y:120}, 48: {x:400, y:180}, 50: {x:400, y:240}, 52: {x:400, y:300}, 54: {x:400, y:360}, 56: {x:400, y:420},
            47: {x:470, y:120}, 49: {x:470, y:180}, 51: {x:470, y:240}, 53: {x:470, y:300}, 55: {x:470, y:360}
        }
    };

    document.getElementById('datePicker').valueAsDate = new Date();

    async function loadSheetData() {
        document.getElementById('loading').innerText = "🔄 시트 동기화 중...";
        try {
            const res = await fetch(SCRIPT_URL);
            fullData = await res.json();
            document.getElementById('loading').innerText = "✅ 동기화 완료";
            render();
        } catch(e) {
            document.getElementById('loading').innerText = "❌ 로딩 실패";
        }
    }

    function render() {
        const map = document.getElementById('map');
        map.innerHTML = '';
        const selectedDate = new Date(document.getElementById('datePicker').value);
        const days = ['일','월','화','수','목','금','토'];
        const dayName = days[selectedDate.getDay()];
        
        if (dayName === '수') {
            map.innerHTML = `<div class="wed-msg">오늘은 수요일이라 야자 배치가 없습니다. 😊</div>`;
            return; 
        }

        if(!fullData[currentPlace]) return;

        fullData[currentPlace].forEach(s => {
            const pos = coords[currentPlace][s.id] || {x: -1000, y: -1000};
            const sch = s.sch[dayName] || [0, 0, 0];

            const card = document.createElement('div');
            card.className = `seat ${pos.wide ? 'wide' : ''}`;
            card.style.left = pos.x + 'px';
            card.style.top = pos.y + 'px';
            card.innerHTML = `
                <div class="seat-header">#${s.id}</div>
                <div class="seat-name">${s.name}</div>
                <div class="btns">
                    <button class="b" ${sch[0] ? '' : 'disabled'}>8</button>
                    <button class="b" ${sch[1] ? '' : 'disabled'}>1</button>
                    <button class="b" ${sch[2] ? '' : 'disabled'}>2</button>
                </div>
            `;
            card.querySelectorAll('.b').forEach(btn => {
                if(!btn.disabled) {
                    btn.onclick = () => btn.classList.toggle('selected');
                }
            });
            card.dataset.id = s.id;
            card.dataset.name = s.name;
            map.appendChild(card);
        });
    }

    function setPlace(p) {
        currentPlace = p;
        document.getElementById('tab-bitmuri').classList.toggle('active', p === '빛무리터');
        document.getElementById('tab-cafe').classList.toggle('active', p === '학습카페');
        render();
    }

    document.getElementById('datePicker').onchange = loadSheetData;

    async function sendData() {
        const teacher = document.getElementById('teacher').value;
        if(!teacher) return alert("선생님 성함을 입력하세요.");
        const date = document.getElementById('datePicker').value;
        const absents = [];
        document.querySelectorAll('.seat').forEach(seat => {
            seat.querySelectorAll('.b.selected').forEach(btn => {
                absents.push({ place: currentPlace, id: seat.dataset.id, name: seat.dataset.name, session: btn.innerText });
            });
        });
        if(absents.length === 0) return alert("결석자를 선택하세요.");
        if(confirm(`${absents.length}건을 저장할까요?`)) {
            const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ date, teacher, absents }) });
            const res = await response.json();
            if(res.result === 'success') { alert("저장 완료!"); location.reload(); }
        }
    }

    loadSheetData();
</script>
</body>
</html>
